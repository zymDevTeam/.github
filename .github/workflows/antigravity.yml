name: '🔀 Antigravity Dispatch'

on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']

jobs:
  antigravity:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: zymDevTeam/zymdev-actions-zelda-app/.github/workflows/reusable-antigravity-dispatch.yml@stable
    secrets: inherit
