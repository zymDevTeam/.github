name: '📋 Antigravity Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 0,12,15,20 * * *'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

jobs:
  scheduled_triage:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: zymDevTeam/zymdev-actions-zelda-app/.github/workflows/reusable-antigravity-scheduled-triage.yml@stable
    secrets: inherit
